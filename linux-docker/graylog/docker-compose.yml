services:
  mongodb:
    image: mongo:6.0
    container_name: deployer-graylog-mongo
    restart: unless-stopped
    volumes:
      - ./mongo_data:/data/db

  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.15.0}
    container_name: deployer-graylog-opensearch
    restart: unless-stopped
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
      - "action.auto_create_index=false"
      - "plugins.security.ssl.http.enabled=false"
      - "plugins.security.disabled=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./opensearch_data:/usr/share/opensearch/data

  graylog:
    image: graylog/graylog:${GRAYLOG_VERSION:-6.0}
    container_name: deployer-graylog
    restart: unless-stopped
    depends_on:
      - mongodb
      - opensearch
    environment:
      GRAYLOG_PASSWORD_SECRET: "${GRAYLOG_PASSWORD_SECRET:-16CharsOrMoreSecretStringForGraylogTokenEncryptKey123456}"
      GRAYLOG_ROOT_PASSWORD_SHA2: "${GRAYLOG_ROOT_PASSWORD_SHA2:-8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918}"
      GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
      GRAYLOG_ELASTICSEARCH_HOSTS: "http://opensearch:9200"
      GRAYLOG_MONGODB_URI: "mongodb://mongodb:27017/graylog"
      GRAYLOG_ROOT_TIMEZONE: "Asia/Taipei"
    ports:
      - "${GRAYLOG_PORT:-9000}:9000"
      - "12201:12201/udp"
      - "1514:1514/udp"
      - "1514:1514/tcp"
    volumes:
      - ./graylog_data:/usr/share/graylog/data
